<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPERPUS SDN MUARASARI 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f5f1}
#app-frame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app-frame" src="index-original.html" title="SIPERPUS SDN Muarasari 1"></iframe>
<script>
(function(){
  const school='./logo%20ms%201%20proses%20%281%29.png';
  const bogor='./images.png';
  const frame=document.getElementById('app-frame');
  function applyBranding(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.head)return;
      if(d.getElementById('siperpus-branding-v1'))return;
      const style=d.createElement('style');
      style.id='siperpus-branding-v1';
      style.textContent=`
        .login-mark{display:none!important}
        .siperpus-login-logos{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
        .siperpus-login-logos img{object-fit:contain;background:#fff;border-radius:12px;padding:3px;width:56px;height:56px}
        .siperpus-login-logos .school{width:64px;height:64px}
        .siperpus-login-logos .bogor{width:52px;height:52px}
        .siperpus-school-caption{text-align:center;color:#C97F1E;font-size:12px;font-weight:800;letter-spacing:.08em;margin:-2px 0 7px}
        .sidebar-brand .mark{display:none!important}
        .siperpus-side-logos{display:flex;align-items:center;gap:5px;flex-shrink:0}
        .siperpus-side-logos img{object-fit:contain;background:#fff;border-radius:6px;padding:2px;width:28px;height:28px}
        .siperpus-side-logos .school{width:34px;height:34px}
        .siperpus-side-logos .bogor{width:27px;height:27px}
        .sidebar-brand .name small:first-of-type{color:#F0C477;font-weight:700}
      `;
      d.head.appendChild(style);

      const loginMark=d.querySelector('.login-mark');
      if(loginMark){
        const wrap=d.createElement('div');
        wrap.className='siperpus-login-logos';
        wrap.innerHTML='<img class="school" src="'+school+'" alt="Logo SDN Muarasari 1"><img class="bogor" src="'+bogor+'" alt="Logo Kota Bogor">';
        loginMark.parentNode.insertBefore(wrap,loginMark);
      }
      const loginTitle=d.querySelector('.login-card h1');
      if(loginTitle){
        const cap=d.createElement('div');
        cap.className='siperpus-school-caption';
        cap.textContent='SDN MUARASARI 1';
        loginTitle.parentNode.insertBefore(cap,loginTitle.nextSibling);
      }
      const brand=d.querySelector('.sidebar-brand');
      if(brand){
        const mark=brand.querySelector('.mark');
        const logos=d.createElement('div');
        logos.className='siperpus-side-logos';
        logos.innerHTML='<img class="school" src="'+school+'" alt="Logo SDN Muarasari 1"><img class="bogor" src="'+bogor+'" alt="Logo Kota Bogor">';
        if(mark) mark.parentNode.insertBefore(logos,mark);
        const name=brand.querySelector('.name');
        if(name){
          const first=name.querySelector('small');
          if(first){first.textContent='SDN MUARASARI 1';}
          const second=d.createElement('small');
          second.textContent='Perpustakaan Sekolah';
          name.appendChild(second);
        }
      }
    }catch(e){console.warn('Branding SIPERPUS belum dapat diterapkan:',e)}
  }
  frame.addEventListener('load',applyBranding);
})();
</script>
</body>
</html>
