name: Fix delete button click handling
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-delete-click.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch delete buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace('data-delete-buku="${b.id}"','data-delete-buku="${b.id}" type="button" onclick="deleteBuku(${b.id})"')
          s=s.replace('data-delete-anggota="${m.id}"','data-delete-anggota="${m.id}" type="button" onclick="deleteAnggota(${m.id})"')
          s=s.replace('data-delete-tx="${tx.id}"','data-delete-tx="${tx.id}" type="button" onclick="deleteTransaksi(${tx.id})"')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          marker='  .btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}\n'
          css='  .table-wrap tbody td:last-child{white-space:nowrap;position:relative;z-index:2;}\n  .table-wrap tbody td:last-child .btn{position:relative;z-index:3;pointer-events:auto;touch-action:manipulation;}\n'
          if css not in s:
              s=s.replace(marker, marker+css)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git rm .github/workflows/fix-delete-click.yml
          git commit -m 'Make delete buttons clickable' || exit 0
          git push