name: Fix delete handlers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix delete handlers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()

          # Add delete buttons to transaction actions.
          old = '''      <td>${
        tx.status === "borrowed"
          ? `<button class="btn btn-ghost btn-sm" data-return-tx="${tx.id}">Kembalikan</button>`
          : ""
      }</td>'''
          new = '''      <td>${
        tx.status === "borrowed"
          ? `<button class="btn btn-ghost btn-sm" data-return-tx="${tx.id}">Kembalikan</button> <button class="btn btn-sm" style="background:#dc2626" data-delete-tx="${tx.id}">Hapus</button>`
          : `<button class="btn btn-sm" style="background:#dc2626" data-delete-tx="${tx.id}">Hapus</button>`
      }</td>'''
          if old not in s:
              raise SystemExit('Transaction action markup not found')
          s = s.replace(old, new, 1)

          # Add delete functions before the transaction section.
          marker = '/* ---------------- Transaksi ---------------- */'
          funcs = r'''async function deleteBuku(id) {
            const book = state.books.find((b) => String(b.id) === String(id));
            if (!book || !confirm(`Hapus buku "${book.title}"?`)) return;
            try {
              await apiFetch("/api/books/" + id, { method: "DELETE" });
              showToast("Buku berhasil dihapus.", "success");
              loadBooks();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          async function deleteAnggota(id) {
            const member = state.members.find((m) => String(m.id) === String(id));
            if (!member || !confirm(`Hapus anggota "${member.name}"?`)) return;
            try {
              await apiFetch("/api/members/" + id, { method: "DELETE" });
              showToast("Anggota berhasil dihapus.", "success");
              loadMembers();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          async function deleteTransaksi(id) {
            const tx = state.transactions.find((t) => String(t.id) === String(id));
            if (!tx || !confirm(`Hapus transaksi ${tx.transaction_code || "ini"}?`)) return;
            try {
              await apiFetch("/api/transactions/" + id, { method: "DELETE" });
              showToast("Transaksi berhasil dihapus.", "success");
              loadTransactions();
              loadBooks();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          '''
          if marker not in s:
              raise SystemExit('Transaction section marker not found')
          if 'async function deleteBuku(' in s or 'async function deleteAnggota(' in s or 'async function deleteTransaksi(' in s:
              raise SystemExit('Delete functions already present')
          s = s.replace(marker, funcs + marker, 1)

          # Extend existing delegated table handlers.
          old = '''  document.getElementById("buku-table-body").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-edit-buku]");
    if (!btn) return;
    const book = state.books.find((b) => String(b.id) === btn.dataset.editBuku);
    if (book) openBukuModal(book);
  });'''
          new = '''  document.getElementById("buku-table-body").addEventListener("click", (e) => {
    const deleteBtn = e.target.closest("[data-delete-buku]");
    if (deleteBtn) return deleteBuku(deleteBtn.dataset.deleteBuku);
    const btn = e.target.closest("[data-edit-buku]");
    if (!btn) return;
    const book = state.books.find((b) => String(b.id) === btn.dataset.editBuku);
    if (book) openBukuModal(book);
  });'''
          if old not in s:
              raise SystemExit('Book event handler not found')
          s = s.replace(old, new, 1)

          old = '''  document.getElementById("anggota-table-body").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-edit-anggota]");
    if (!btn) return;
    const member = state.members.find((m) => String(m.id) === btn.dataset.editAnggota);
    if (member) openAnggotaModal(member);
  });'''
          new = '''  document.getElementById("anggota-table-body").addEventListener("click", (e) => {
    const deleteBtn = e.target.closest("[data-delete-anggota]");
    if (deleteBtn) return deleteAnggota(deleteBtn.dataset.deleteAnggota);
    const btn = e.target.closest("[data-edit-anggota]");
    if (!btn) return;
    const member = state.members.find((m) => String(m.id) === btn.dataset.editAnggota);
    if (member) openAnggotaModal(member);
  });'''
          if old not in s:
              raise SystemExit('Member event handler not found')
          s = s.replace(old, new, 1)

          old = '''  document.getElementById("transaksi-table-body").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-return-tx]");
    if (!btn) return;
    const tx = state.transactions.find((t) => String(t.id) === btn.dataset.returnTx);
    if (tx) openKembaliModal(tx);
  });'''
          new = '''  document.getElementById("transaksi-table-body").addEventListener("click", (e) => {
    const deleteBtn = e.target.closest("[data-delete-tx]");
    if (deleteBtn) return deleteTransaksi(deleteBtn.dataset.deleteTx);
    const btn = e.target.closest("[data-return-tx]");
    if (!btn) return;
    const tx = state.transactions.find((t) => String(t.id) === btn.dataset.returnTx);
    if (tx) openKembaliModal(tx);
  });'''
          if old not in s:
              raise SystemExit('Transaction event handler not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          node --check app.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/fix-delete-handlers.yml
          git commit -m "Fix delete handlers"
          git push
