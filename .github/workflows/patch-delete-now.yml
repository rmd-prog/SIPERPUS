name: Patch delete functions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          s=s.replace('<td><button class="btn btn-ghost btn-sm" data-edit-buku="${b.id}">Edit</button></td>', '<td><button class="btn btn-ghost btn-sm" data-edit-buku="${b.id}">Edit</button> <button class="btn btn-sm" style="background:#dc2626" data-delete-buku="${b.id}">Hapus</button></td>')
          s=s.replace('<td><button class="btn btn-ghost btn-sm" data-edit-anggota="${m.id}">Edit</button></td>', '<td><button class="btn btn-ghost btn-sm" data-edit-anggota="${m.id}">Edit</button> <button class="btn btn-sm" style="background:#dc2626" data-delete-anggota="${m.id}">Hapus</button></td>')
          p.write_text(s)
          p=Path('src/index.js'); s=p.read_text()
          marker="const bookMatch = path.match(/^\\/api\\/books\\/(\\d+)$/);"
          add=marker+"\n      if (bookMatch && request.method === 'DELETE') { const id=Number(bookMatch[1]); const h=await env.DB.prepare('SELECT COUNT(*) AS n FROM transactions WHERE book_id=?').bind(id).first(); if(Number(h?.n||0)>0)return json({error:'Buku memiliki riwayat transaksi.'},409,origin); await env.DB.prepare('DELETE FROM books WHERE id=?').bind(id).run(); return json({ok:true},200,origin); }"
          s=s.replace(marker,add,1)
          marker="const memberMatch = path.match(/^\\/api\\/members\\/(\\d+)$/);"
          add=marker+"\n      if (memberMatch && request.method === 'DELETE') { const id=Number(memberMatch[1]); const h=await env.DB.prepare('SELECT COUNT(*) AS n FROM transactions WHERE member_id=?').bind(id).first(); if(Number(h?.n||0)>0)return json({error:'Anggota memiliki riwayat transaksi.'},409,origin); await env.DB.prepare('DELETE FROM members WHERE id=?').bind(id).run(); return json({ok:true},200,origin); }"
          s=s.replace(marker,add,1)
          marker="const returnMatch = path.match(/^\\/api\\/transactions\\/(\\d+)\\/return$/);"
          add="const transactionMatch = path.match(/^\\/api\\/transactions\\/(\\d+)$/);\n      if (transactionMatch && request.method === 'DELETE') { const id=Number(transactionMatch[1]); const t=await env.DB.prepare('SELECT book_id,status FROM transactions WHERE id=?').bind(id).first(); if(!t)return json({error:'Transaksi tidak ditemukan.'},404,origin); if(t.status==='borrowed'){ await env.DB.batch([env.DB.prepare('DELETE FROM transactions WHERE id=?').bind(id),env.DB.prepare('UPDATE books SET available=MIN(stock,available+1) WHERE id=?').bind(t.book_id)]); } else { await env.DB.prepare('DELETE FROM transactions WHERE id=?').bind(id).run(); } return json({ok:true},200,origin); }\n\n      "+marker
          s=s.replace(marker,add,1)
          p.write_text(s)
          PY
          node --check app.js
          node --check src/index.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js src/index.js
          git rm .github/workflows/patch-delete-now.yml
          git commit -m 'Add delete functions'
          git push
