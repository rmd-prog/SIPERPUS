name: Add SIPERPUS delete functions

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend and worker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('app.js'); s=p.read_text()
          s=s.replace('<td><button class="btn btn-ghost btn-sm" data-edit-buku="${b.id}">Edit</button></td>', '<td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-edit-buku="${b.id}">Edit</button><button class="btn btn-sm" style="background:#dc2626" data-delete-buku="${b.id}">Hapus</button></div></td>')
          s=s.replace('<td><button class="btn btn-ghost btn-sm" data-edit-anggota="${m.id}">Edit</button></td>', '<td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-edit-anggota="${m.id}">Edit</button><button class="btn btn-sm" style="background:#dc2626" data-delete-anggota="${m.id}">Hapus</button></div></td>')
          old='''async function saveBuku() {'''
          ins='''async function deleteBuku(id) {
            const book = state.books.find((b) => String(b.id) === String(id));
            if (!book) return;
            if (!confirm(`Hapus buku "${book.title}"? Data yang sudah memiliki riwayat transaksi tidak dapat dihapus.`)) return;
            try {
              await apiFetch("/api/books/" + id, { method: "DELETE" });
              showToast("Buku berhasil dihapus.", "success");
              loadBooks();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          async function saveBuku() {'''
          s=s.replace(old,ins,1)
          old='''async function saveAnggota() {'''
          ins='''async function deleteAnggota(id) {
            const member = state.members.find((m) => String(m.id) === String(id));
            if (!member) return;
            if (!confirm(`Hapus anggota "${member.name}"? Data yang sudah memiliki riwayat transaksi tidak dapat dihapus.`)) return;
            try {
              await apiFetch("/api/members/" + id, { method: "DELETE" });
              showToast("Anggota berhasil dihapus.", "success");
              loadMembers();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          async function saveAnggota() {'''
          s=s.replace(old,ins,1)
          old='''async function saveKembali() {'''
          ins='''async function deleteTransaksi(id) {
            const tx = state.transactions.find((t) => String(t.id) === String(id));
            if (!tx) return;
            if (!confirm(`Hapus transaksi ${tx.transaction_code}? Jika masih dipinjam, stok buku akan dikembalikan otomatis.`)) return;
            try {
              await apiFetch("/api/transactions/" + id, { method: "DELETE" });
              showToast("Transaksi berhasil dihapus.", "success");
              loadTransactions();
              loadBooks();
              if (state.currentPage === "dashboard") loadDashboard();
            } catch (err) {
              if (err.message !== "Unauthorized") showToast(err.message, "error");
            }
          }

          async function saveKembali() {'''
          s=s.replace(old,ins,1)
          old='''          tx.status === "borrowed"
          ? `<button class="btn btn-ghost btn-sm" data-return-tx="${tx.id}">Kembalikan</button>`
          : ""
      }</td>'''
          new='''          tx.status === "borrowed"
          ? `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-return-tx="${tx.id}">Kembalikan</button><button class="btn btn-sm" style="background:#dc2626" data-delete-tx="${tx.id}">Hapus</button></div>`
          : `<button class="btn btn-sm" style="background:#dc2626" data-delete-tx="${tx.id}">Hapus</button>`
      }</td>'''
          s=s.replace(old,new,1)
          old='''    const btn = e.target.closest("[data-edit-buku]");
    if (!btn) return;
    const book = state.books.find((b) => String(b.id) === btn.dataset.editBuku);
    if (book) openBukuModal(book);'''
          new='''    const deleteBtn = e.target.closest("[data-delete-buku]");
    if (deleteBtn) { deleteBuku(deleteBtn.dataset.deleteBuku); return; }
    const btn = e.target.closest("[data-edit-buku]");
    if (!btn) return;
    const book = state.books.find((b) => String(b.id) === btn.dataset.editBuku);
    if (book) openBukuModal(book);'''
          s=s.replace(old,new,1)
          old='''    const btn = e.target.closest("[data-edit-anggota]");
    if (!btn) return;
    const member = state.members.find((m) => String(m.id) === btn.dataset.editAnggota);
    if (member) openAnggotaModal(member);'''
          new='''    const deleteBtn = e.target.closest("[data-delete-anggota]");
    if (deleteBtn) { deleteAnggota(deleteBtn.dataset.deleteAnggota); return; }
    const btn = e.target.closest("[data-edit-anggota]");
    if (!btn) return;
    const member = state.members.find((m) => String(m.id) === btn.dataset.editAnggota);
    if (member) openAnggotaModal(member);'''
          s=s.replace(old,new,1)
          old='''    const btn = e.target.closest("[data-return-tx]");
    if (!btn) return;
    const tx = state.transactions.find((t) => String(t.id) === btn.dataset.returnTx);
    if (tx) openKembaliModal(tx);'''
          new='''    const deleteBtn = e.target.closest("[data-delete-tx]");
    if (deleteBtn) { deleteTransaksi(deleteBtn.dataset.deleteTx); return; }
    const btn = e.target.closest("[data-return-tx]");
    if (!btn) return;
    const tx = state.transactions.find((t) => String(t.id) === btn.dataset.returnTx);
    if (tx) openKembaliModal(tx);'''
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/index.js'); s=p.read_text()
          marker="""      const bookMatch = path.match(/^\\/api\\/books\\/(\\d+)$/);\n      if (bookMatch && request.method === 'PUT') {"""
          insert="""      const bookMatch = path.match(/^\\/api\\/books\\/(\\d+)$/);\n      if (bookMatch && request.method === 'DELETE') {\n        const id = Number(bookMatch[1]);\n        const existing = await env.DB.prepare('SELECT id,title FROM books WHERE id=?').bind(id).first();\n        if (!existing) return json({ error: 'Buku tidak ditemukan.' }, 404, origin);\n        const history = await env.DB.prepare('SELECT COUNT(*) AS n FROM transactions WHERE book_id=?').bind(id).first();\n        if (Number(history?.n || 0) > 0) return json({ error: 'Buku tidak dapat dihapus karena sudah memiliki riwayat transaksi.' }, 409, origin);\n        await env.DB.prepare('DELETE FROM books WHERE id=?').bind(id).run();\n        return json({ ok: true }, 200, origin);\n      }\n\n      if (bookMatch && request.method === 'PUT') {"""
          if marker not in s: raise SystemExit('book marker not found')
          s=s.replace(marker,insert,1)
          marker="""      const memberMatch = path.match(/^\\/api\\/members\\/(\\d+)$/);\n      if (memberMatch && request.method === 'PUT') {"""
          insert="""      const memberMatch = path.match(/^\\/api\\/members\\/(\\d+)$/);\n      if (memberMatch && request.method === 'DELETE') {\n        const id = Number(memberMatch[1]);\n        const existing = await env.DB.prepare('SELECT id,name FROM members WHERE id=?').bind(id).first();\n        if (!existing) return json({ error: 'Anggota tidak ditemukan.' }, 404, origin);\n        const history = await env.DB.prepare('SELECT COUNT(*) AS n FROM transactions WHERE member_id=?').bind(id).first();\n        if (Number(history?.n || 0) > 0) return json({ error: 'Anggota tidak dapat dihapus karena sudah memiliki riwayat transaksi.' }, 409, origin);\n        await env.DB.prepare('DELETE FROM members WHERE id=?').bind(id).run();\n        return json({ ok: true }, 200, origin);\n      }\n\n      if (memberMatch && request.method === 'PUT') {"""
          if marker not in s: raise SystemExit('member marker not found')
          s=s.replace(marker,insert,1)
          marker="""      const returnMatch = path.match(/^\\/api\\/transactions\\/(\\d+)\\/return$/);"""
          insert="""      const transactionMatch = path.match(/^\\/api\\/transactions\\/(\\d+)$/);\n      if (transactionMatch && request.method === 'DELETE') {\n        const id = Number(transactionMatch[1]);\n        const trx = await env.DB.prepare('SELECT id,book_id,status FROM transactions WHERE id=?').bind(id).first();\n        if (!trx) return json({ error: 'Transaksi tidak ditemukan.' }, 404, origin);\n        if (trx.status === 'borrowed') {\n          await env.DB.batch([\n            env.DB.prepare('DELETE FROM transactions WHERE id=?').bind(id),\n            env.DB.prepare('UPDATE books SET available=MIN(stock,available+1) WHERE id=?').bind(trx.book_id)\n          ]);\n        } else {\n          await env.DB.prepare('DELETE FROM transactions WHERE id=?').bind(id).run();\n        }\n        return json({ ok: true }, 200, origin);\n      }\n\n      const returnMatch = path.match(/^\\/api\\/transactions\\/(\\d+)\\/return$/);"""
          if marker not in s: raise SystemExit('transaction marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
      - name: Validate syntax
        run: |
          node --check app.js
          node --check src/index.js
      - name: Commit changes and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/index.js
          git rm .github/workflows/add-delete-functions.yml
          git commit -m "Add delete functions for books members and transactions"
          git push origin HEAD:main
